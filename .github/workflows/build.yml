name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: smoke test (server start)
        continue-on-error: true
        run: |
          if [ -f build/libs/unfading_dawn.jar ] && [ ! -f .ci/skip_server ]; then
            mkdir -p run && echo eula=true > run/eula.txt && echo pause-when-empty-seconds=-1 > run/server.properties
            (DUSHI_SELFTEST=1 timeout 480 ./gradlew runServer --no-daemon > server.log 2>&1 || true)
          fi
      - name: client screenshots
        continue-on-error: true
        run: |
          if [ -f build/libs/unfading_dawn.jar ] && [ -f .ci/client ]; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libopenal1) > apt.log 2>&1 || true
            (DUSHI_CLIENTTEST=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 2700 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true)
          fi
      - name: the map
        continue-on-error: true
        run: |
          if [ -f build/libs/unfading_dawn.jar ] && [ -f .ci/map ]; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libopenal1 zip) >> apt.log 2>&1 || true
            mkdir -p run && echo eula=true > run/eula.txt
            printf '%s\n' 'level-name=High_Stockade' 'level-type=minecraft\:flat' \
              'generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:stone","height"\:69},{"block"\:"minecraft\:dirt","height"\:3},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:taiga","features"\:true,"lakes"\:false,"structure_overrides"\:[]}' \
              'generate-structures=false' 'gamemode=adventure' 'difficulty=normal' 'spawn-protection=0' 'pause-when-empty-seconds=-1' > run/server.properties
            (DUSHI_BUILDMAP="$PWD/map/high_stockade.plan.txt" timeout 900 ./gradlew runServer --no-daemon > map.log 2>&1 || true)
            rm -rf run/High_Stockade/playerdata run/High_Stockade/stats run/High_Stockade/advancements run/High_Stockade/session.lock \
              run/High_Stockade/players run/High_Stockade/level.dat_old run/High_Stockade/syncedconfig
            python3 tools/name_world.py run/High_Stockade/level.dat "Вышний Острог" >> map.log 2>&1 || true
            cp map/readme.txt run/High_Stockade/readme.txt || true
            if [ -f map/icon.png ]; then cp map/icon.png run/High_Stockade/icon.png; fi
            (cd run && zip -qr ../High_Stockade.zip High_Stockade) || true
            ls -la High_Stockade.zip run/High_Stockade || true
            if [ -f .ci/mapshots ]; then
              mkdir -p run/saves && rm -rf run/saves/High_Stockade && cp -r run/High_Stockade run/saves/
              (DUSHI_MAPTEST="$PWD/map/views.txt" LIBGL_ALWAYS_SOFTWARE=1 timeout 2700 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > mapclient.log 2>&1 || true)
            fi
          fi
      - name: api reference
        continue-on-error: true
        run: |
          mkdir -p /tmp/out/ref /tmp/out/api
          JAR=$(ls build/moddev/artifacts/minecraft-patched-*.jar 2>/dev/null | head -1)
          if [ -f .ci/dump_api ] && [ -n "$JAR" ]; then
            unzip -Z1 "$JAR" | grep '\.class$' | sed 's/\.class$//' | tr '/' '.' | sort > /tmp/classes.txt
            wc -l /tmp/classes.txt
            xargs -n 300 javap -cp "$JAR" -protected < /tmp/classes.txt > /tmp/out/api/minecraft.txt 2> /tmp/out/api/javap.err || true
            gzip -9 /tmp/out/api/minecraft.txt
            unzip -Z1 "$JAR" | grep -v '\.class$' | gzip -9 > /tmp/out/api/resources.txt.gz
            find ~/.gradle -name "neoforge-*-sources.jar" -exec cp {} /tmp/out/api/ \; || true
          fi
          if [ -f .ci/ref.txt ] && [ -n "$JAR" ]; then
            unzip -o -q "$JAR" $(cat .ci/ref.txt) -d /tmp/out/ref 2>/dev/null || true
          fi
      - name: publish outputs to ci-out and ci-shots
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          # ci-out: logs, summary.txt, the jar, the map, sheets of pictures (small: it must always arrive).
          # ci-shots: every picture in full (large; a failure to push it loses nothing else).
          mkdir -p /tmp/out /tmp/shots/shots
          cp build.log /tmp/out/ || true
          tail -c 400000 server.log > /tmp/out/server.log 2>/dev/null || true
          tail -c 400000 client.log > /tmp/out/client.log 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          tail -c 200000 map.log > /tmp/out/map.log 2>/dev/null || true
          tail -c 200000 mapclient.log > /tmp/out/mapclient.log 2>/dev/null || true
          cp High_Stockade.zip /tmp/out/ 2>/dev/null || true
          cp run/screenshots/*.png /tmp/shots/shots/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/out/latest.log 2>/dev/null || true
          ls run/crash-reports/* >/dev/null 2>&1 && mkdir -p /tmp/out/crash && cp run/crash-reports/* /tmp/out/crash/ || true
          find /tmp/out -maxdepth 1 -type f -size 0 -delete
          (python3 -c "import PIL" 2>/dev/null || python3 -m pip install -q pillow || sudo apt-get install -y -qq python3-pil) > /dev/null 2>&1 || true
          python3 tools/ci_sheets.py /tmp/shots/shots /tmp/out/sheets || true
          curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/counts.json?ref=ci-out" -o /tmp/prev.json || rm -f /tmp/prev.json
          python3 tools/ci_summary.py /tmp/out /tmp/prev.json || true
          publish() {
            cd "$1" && git init -q -b "$2" && git config user.name ci && git config user.email ci@users.noreply.github.com
            git add -A && git commit -qm "ci output for $GITHUB_SHA"
            for i in 1 2 3 4; do
              git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" "$2" && return 0
              sleep 20
            done
            return 1
          }
          publish /tmp/out ci-out
          publish /tmp/shots ci-shots || true
